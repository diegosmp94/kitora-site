name: Kitora V1 automated checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: Site, plans, IA and payment guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline checks (no Stripe charge, no AI API calls)
        run: |
          set -eu
          node tests/site-smoke.mjs
          node tests/free-tools-access.mjs
          node tests/test-three-tiers.mjs
          node tests/v1-phase2-readiness.mjs
          node tests/ai-queue-readiness.mjs
          node tests/plus-generation-smoke.mjs
          node tests/payment-security.mjs
          node tests/stripe-reconciliation-readiness.mjs
          node tests/cloud-conflict-safety.mjs
      - name: Verify deployed API rejects unauthenticated requests
        run: node tests/public-api-smoke.mjs
      - name: Verify sensitive database tables expose no anonymous records
        run: node tests/anonymous-database-access.mjs
      - name: Install headless browser for guest onboarding
        run: |
          npm install --no-save playwright@1.58.2 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Test three guest trials and signup in Chromium
        run: node tests/browser-guest-onboarding.mjs
      - name: Test plan access for guest, Free and paid subscribers
        run: node tests/browser-plan-entitlements.mjs
      - name: Test hybrid immersive homepage responsive, accessibility and performance
        run: node tests/browser-home-immersive.mjs
      - name: Test homepage keyboard support and auth modal focus
        run: node tests/browser-home-keyboard.mjs
