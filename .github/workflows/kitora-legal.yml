name: Kitora legal pages checks
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/kitora-legal-center-20261019
permissions:
  contents: read
jobs:
  legal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check-legal-pages.mjs
      - run: node tests/check-merchant-legal-status.mjs
      - run: node tests/check-kitora-unified-contact.mjs
