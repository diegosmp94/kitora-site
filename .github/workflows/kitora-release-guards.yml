name: Kitora release guards
on:
  pull_request:
    branches: [main]
  push:
    branches: ['release/**']
permissions:
  contents: read
jobs:
  checkout-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-live-checkout.mjs
