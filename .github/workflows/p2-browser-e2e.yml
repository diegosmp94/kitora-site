name: Kitora P2 browser E2E
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Run browser E2E against isolated branch preview
        run: |
          node tests/p2-browser-e2e.mjs
          node tests/p2-auth-mocked-e2e.mjs
          node tests/p3-invoice-checks.mjs
          node tests/p3-invoice-browser-e2e.mjs
          node tests/p3-analytics-browser-e2e.mjs
          node tests/p3-commerce-browser-e2e.mjs
          node tests/p3-cart-browser-e2e.mjs
